[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "escalated-django"
version = "0.7.15"
description = "Embeddable support ticket system for Django"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Escalated Dev", email = "hello@escalated.dev"}]
dependencies = [
    # 5.2.17 is the oldest supported Django clear of the 2026 advisories;
    # 4.2, 5.0 and 5.1 are past end of life and get no security fixes.
    "django>=5.2.17",
    "inertia-django>=1.0",
    "requests>=2.33.0",
    # EncryptedJSONField (ImportJob.credentials) encrypts with Fernet. 50.0.0
    # is the first release clear of the advisories published up to 2026-08
    # (GHSA-g6cj-pr64-35w5, GHSA-jwv3-5hgf-82ww, GHSA-537c-gmf6-5ccf).
    "cryptography>=50.0.0",
    # TOTP for two-factor authentication (RFC 6238).
    "pyotp>=2.9",
    # Single sign-on: XML signatures, OAuth 2 / OIDC with PKCE, and JWT.
    "signxml>=4.0.4",
    "Authlib>=1.9.1",
    "PyJWT>=2.15.0",
    # Central translations: a copy of escalated-locale's gettext catalogues
    # is bundled at escalated/_central_locale/ (see its README). PyPI rejects
    # git-URL dependencies, so escalated-locale itself is only the optional
    # `locale` extra below.
]

[project.optional-dependencies]
# Installs the standalone escalated-locale package, whose catalogues then win
# over the bundled copy. Plain version spec: PyPI refuses `name @ url` here too.
locale = ["escalated-locale>=0.1.8"]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "factory-boy>=3.2",
    "faker>=18.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"

[project.urls]
Homepage = "https://github.com/escalated-dev/escalated-django"

[tool.ruff]
line-length = 120
target-version = "py310"
# Vendored widget bundle, built by @escalated-dev/escalated.
extend-exclude = ["escalated/static/escalated/widget"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "DJ"]
ignore = ["DJ001", "UP017"]

[tool.ruff.format]
quote-style = "double"
