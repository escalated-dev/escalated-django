[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "escalated-django"
version = "0.7.2"
description = "Embeddable support ticket system for Django"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Escalated Dev", email = "hello@escalated.dev"}]
dependencies = [
    "django>=4.2",
    "inertia-django>=1.0",
    "requests>=2.28",
    # EncryptedJSONField (ImportJob.credentials) encrypts with Fernet. 44.0.1
    # is the first release clear of the RSA, PKCS12 and bundled-OpenSSL
    # advisories published up to 2025; hosts can and should run newer.
    "cryptography>=44.0.1",
    # Central translations: a copy of escalated-locale's gettext catalogues
    # is bundled at escalated/_central_locale/ (see its README). PyPI rejects
    # git-URL dependencies, so escalated-locale itself is only the optional
    # `locale` extra below.
]

[project.optional-dependencies]
# Installs the standalone escalated-locale package, whose catalogues then win
# over the bundled copy. Plain version spec: PyPI refuses `name @ url` here too.
locale = ["escalated-locale>=0.1.8"]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "factory-boy>=3.2",
    "faker>=18.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"

[project.urls]
Homepage = "https://github.com/escalated-dev/escalated-django"

[tool.ruff]
line-length = 120
target-version = "py310"
# Vendored widget bundle, built by @escalated-dev/escalated.
extend-exclude = ["escalated/static/escalated/widget"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "DJ"]
ignore = ["DJ001", "UP017"]

[tool.ruff.format]
quote-style = "double"
